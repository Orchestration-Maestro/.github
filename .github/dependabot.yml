version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The organization merges only conventional titles: "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    # One pull request a week for patch and minor updates, which
    # dependabot-auto-merge.yml queues; a major update keeps its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
