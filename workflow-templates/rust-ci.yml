name: CI
"on":
  push:
    branches: [$default-branch]
  pull_request:
permissions:
  contents: read
jobs:
  # Keep the job id `rust`: the rust-ci-required ruleset requires the check
  # "rust / Required Rust CI" before any merge to the default branch.
  rust:
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/ci.yml@8833513119e39850589ce40950a3de72f46c8613  # v1.1.0
    permissions:
      contents: read
  # Clippy and secret-scan findings into the Security tab: the only job that
  # needs a write scope.
  sarif:
    needs: rust
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/upload-sarif.yml@8833513119e39850589ce40950a3de72f46c8613  # v1.1.0
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    with:
      artifact-name: ${{ needs.rust.outputs.artifact-name }}
  # Coverage and test results into Codecov, logged in through OIDC: the only
  # job with id-token: write. The Codecov app is installed organization-wide.
  coverage:
    needs: rust
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/upload-coverage.yml@8833513119e39850589ce40950a3de72f46c8613  # v1.1.0
    permissions:
      contents: read
      id-token: write  # log in to Codecov without a stored token
    with:
      artifact-name: ${{ needs.rust.outputs.artifact-name }}
