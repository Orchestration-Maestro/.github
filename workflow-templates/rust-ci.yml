name: CI
"on":
  push:
    branches: [$default-branch]
  pull_request:
permissions:
  contents: read
jobs:
  # Keep the job id `rust`: the rust-ci-required ruleset requires the check
  # "rust / Required Rust CI" before any merge to the default branch.
  rust:
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/ci.yml@0cc74ca4b1dbcb564e49483340e81513e2de1131  # rust-workflows, reviewed
    permissions:
      contents: read
